# Workflow

# Should have a name. No indentation required.
name: Hello

# on tells when the workflow should run
on:
  workflow_dispatch:

# Jobs
jobs:
  say-hello:

    # Create an ephemeral Ubuntu runner
    runs-on: ubuntu-latest

    # Steps to execute
    steps:
      - name: Say hello to everyone
        run: echo "Hello Dosto"

# Steps are inside a job
# Actions are inside steps
